<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="JobSquad - the multiplayer job hunt">
  <rect width="1200" height="340" fill="#0F1216"/>

  <!-- signature motif: squad avatars, each ringed in that member's status colour -->
  <g transform="translate(830 120)">
    <g>
      <circle cx="0" cy="50" r="34" fill="#3F6FA8"/>
      <circle cx="0" cy="50" r="36.5" fill="none" stroke="#D9903C" stroke-width="3"/>
      <text x="0" y="58" font-family="IBM Plex Sans, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">HA</text>
    </g>
    <g transform="translate(58 0)">
      <circle cx="0" cy="50" r="34" fill="#0F1216"/>
      <circle cx="0" cy="50" r="34" fill="#2E8C6A"/>
      <circle cx="0" cy="50" r="36.5" fill="none" stroke="#3FA875" stroke-width="3"/>
      <text x="0" y="58" font-family="IBM Plex Sans, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">AL</text>
    </g>
    <g transform="translate(116 0)">
      <circle cx="0" cy="50" r="34" fill="#0F1216"/>
      <circle cx="0" cy="50" r="34" fill="#8A5BA8"/>
      <circle cx="0" cy="50" r="36.5" fill="none" stroke="#E06C6C" stroke-width="3"/>
      <text x="0" y="58" font-family="IBM Plex Sans, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">SA</text>
    </g>
    <g transform="translate(174 0)">
      <circle cx="0" cy="50" r="34" fill="#0F1216"/>
      <circle cx="0" cy="50" r="34" fill="#5C6470"/>
      <circle cx="0" cy="50" r="36.5" fill="none" stroke="#333A44" stroke-width="3"/>
      <text x="0" y="58" font-family="IBM Plex Sans, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#98A2B0" text-anchor="middle">+2</text>
    </g>
  </g>

  <text x="80" y="150" font-family="IBM Plex Sans, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="600" letter-spacing="-2" fill="#E7EAEE">JobSquad</text>
  <text x="82" y="198" font-family="IBM Plex Sans, Segoe UI, Roboto, sans-serif" font-size="27" fill="#98A2B0">The multiplayer job hunt.</text>

  <!-- status legend strip -->
  <g font-family="IBM Plex Mono, ui-monospace, Consolas, monospace" font-size="14" fill="#98A2B0">
    <circle cx="88" cy="252" r="5" fill="#8A94A3"/><text x="102" y="257">Saved</text>
    <circle cx="182" cy="252" r="5" fill="#5B8DEF"/><text x="196" y="257">Applied</text>
    <circle cx="288" cy="252" r="5" fill="#9B7BE8"/><text x="302" y="257">Assessment</text>
    <circle cx="424" cy="252" r="5" fill="#D9903C"/><text x="438" y="257">Interview</text>
    <circle cx="546" cy="252" r="5" fill="#3FA875"/><text x="560" y="257">Offer</text>
    <circle cx="638" cy="252" r="5" fill="#E06C6C"/><text x="652" y="257">Rejected</text>
    <circle cx="748" cy="252" r="5" fill="#7C838C"/><text x="762" y="257">Ghosted</text>
  </g>

  <rect x="80" y="296" width="1040" height="1" fill="#262C34"/>
</svg>
