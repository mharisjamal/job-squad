<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Discovery is shared, progress is personal">
  <rect width="1200" height="470" fill="#0F1216"/>

  <text x="60" y="52" font-family="IBM Plex Sans, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="600" fill="#E7EAEE">Discovery is shared. Progress is personal.</text>
  <text x="60" y="82" font-family="IBM Plex Sans, Segoe UI, Roboto, sans-serif" font-size="16" fill="#98A2B0">Anyone can post a company once. Everyone tracks their own application on it.</text>

  <!-- LEFT: shared pool -->
  <rect x="60" y="118" width="470" height="300" rx="12" fill="#171B21" stroke="#262C34"/>
  <text x="86" y="152" font-family="IBM Plex Mono, ui-monospace, Consolas, monospace" font-size="13" fill="#98A2B0">SHARED POOL</text>

  <g font-family="IBM Plex Sans, Segoe UI, Roboto, sans-serif">
    <rect x="86" y="170" width="418" height="52" rx="8" fill="#1E232A" stroke="#262C34"/>
    <text x="106" y="194" font-size="16" font-weight="600" fill="#E7EAEE">TechCorp</text>
    <text x="106" y="212" font-size="13" fill="#98A2B0">Remote  ·  posted by Ali</text>

    <rect x="86" y="234" width="418" height="52" rx="8" fill="#1E232A" stroke="#262C34"/>
    <text x="106" y="258" font-size="16" font-weight="600" fill="#E7EAEE">Nimbus Labs</text>
    <text x="106" y="276" font-size="13" fill="#98A2B0">Berlin  ·  posted by Haris</text>

    <rect x="86" y="298" width="418" height="52" rx="8" fill="#1E232A" stroke="#262C34"/>
    <text x="106" y="322" font-size="16" font-weight="600" fill="#E7EAEE">Vector Pay</text>
    <text x="106" y="340" font-size="13" fill="#98A2B0">Karachi  ·  posted by Sara</text>

    <text x="86" y="382" font-size="13" fill="#98A2B0">+ shared notes, job portals, and a comment thread per company</text>
  </g>

  <!-- arrow -->
  <g>
    <line x1="548" y1="268" x2="640" y2="268" stroke="#333A44" stroke-width="2"/>
    <path d="M640 268 l-12 -6 v12 z" fill="#333A44"/>
  </g>

  <!-- RIGHT: personal pipelines -->
  <rect x="660" y="118" width="480" height="300" rx="12" fill="#171B21" stroke="#262C34"/>
  <text x="686" y="152" font-family="IBM Plex Mono, ui-monospace, Consolas, monospace" font-size="13" fill="#98A2B0">EVERYONE'S OWN STATUS ON THE SAME COMPANY</text>

  <g font-family="IBM Plex Sans, Segoe UI, Roboto, sans-serif">
    <!-- row 1 -->
    <circle cx="706" cy="192" r="17" fill="#3F6FA8"/>
    <text x="706" y="198" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">HA</text>
    <text x="734" y="189" font-size="15" fill="#E7EAEE">Haris</text>
    <text x="734" y="207" font-size="12.5" fill="#98A2B0">applied via LinkedIn, follow up Friday</text>
    <rect x="960" y="178" width="86" height="26" rx="13" fill="#2A2015"/>
    <circle cx="976" cy="191" r="4" fill="#D9903C"/>
    <text x="987" y="196" font-family="IBM Plex Mono, ui-monospace, Consolas, monospace" font-size="12" fill="#E5A55A">Interview</text>

    <!-- row 2 -->
    <circle cx="706" cy="256" r="17" fill="#2E8C6A"/>
    <text x="706" y="262" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">AL</text>
    <text x="734" y="253" font-size="15" fill="#E7EAEE">Ali</text>
    <text x="734" y="271" font-size="12.5" fill="#98A2B0">"wants 3 years experience, ask for referral"</text>
    <rect x="960" y="242" width="84" height="26" rx="13" fill="#2A1719"/>
    <circle cx="976" cy="255" r="4" fill="#E06C6C"/>
    <text x="987" y="260" font-family="IBM Plex Mono, ui-monospace, Consolas, monospace" font-size="12" fill="#F08585">Rejected</text>

    <!-- row 3 -->
    <circle cx="706" cy="320" r="17" fill="#8A5BA8"/>
    <text x="706" y="326" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">SA</text>
    <text x="734" y="317" font-size="15" fill="#E7EAEE">Sara</text>
    <text x="734" y="335" font-size="12.5" fill="#98A2B0">has not applied yet</text>
    <rect x="960" y="306" width="70" height="26" rx="13" fill="#1A1F26"/>
    <circle cx="976" cy="319" r="4" fill="#8A94A3"/>
    <text x="987" y="324" font-family="IBM Plex Mono, ui-monospace, Consolas, monospace" font-size="12" fill="#A8B3C2">Saved</text>

    <text x="686" y="382" font-size="13" fill="#98A2B0">Nobody overwrites anyone. You see what worked, and what did not.</text>
  </g>
</svg>
