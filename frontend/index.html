<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0F1216" />
    <title>JobSquad</title>
    <script>
      // Runs before first paint so the theme never flashes. Dark is the
      // default: only an explicit "light" preference switches modes.
      (function () {
        try {
          if (localStorage.getItem("jobsquad_theme") === "light") {
            document.documentElement.dataset.theme = "light";
          }
        } catch (e) {
          /* storage blocked: stay on the dark default */
        }
      })();
    </script>
    <style>
      html {
        background: #0f1216;
        color: #e7eaee;
      }
      html[data-theme="light"] {
        background: #f7f7f5;
        color: #1a1d21;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
